grqo:
  alpha: 2.5
  alpha_invar: 0.5
  beta: 0.3
  ddropout: 0.1
  dropout: 0.1
  gamma_var: 0.8
  lambda_grqo: 1.0
  num_heads: 6
  num_layers: 4
  num_tokens: 48
  random_k: null
  reward_proxy: taylor
  tau: 0.05
  teacher_ema: 0.995
  temperature: 0.05
models:
  resnet18:
    backbone_dim: 512
    grqo_dim: 384
    pretrained: IMAGENET1K_V1
  resnet34:
    backbone_dim: 512
    grqo_dim: 384
    pretrained: IMAGENET1K_V1
  resnet50:
    backbone_dim: 2048
    grqo_dim: 384
    pretrained: IMAGENET1K_V1
  vit-small:
    grqo_dim: 384
    hidden_dim: 384
    pretrained: WinKawaks/vit-small-patch16-224
  vit-tiny:
    grqo_dim: 192
    hidden_dim: 192
    pretrained: WinKawaks/vit-tiny-patch16-224
system:
  ckpt_dir: ./checkpoints
  device: cuda
  num_workers: 0
  results_dir: ./results
  seed: 42
train:
  batch_size: 256
  epochs: 20
  lr: 0.0001
  weight_decay: 0.01
